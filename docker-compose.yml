services:

  kafka:
    image: apache/kafka:4.0.1
    container_name: cloudguard-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9093,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9094
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    restart: always

  demo-app:
    build:
      context: ./live-app
      dockerfile: Dockerfile
    container_name: cloudguard-demo-app
    ports:
      - "8080:8080"
    restart: always

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: cloudguard-dashboard
    ports:
      - "5000:5000"
    environment:
      - KAFKA_SERVER=kafka:9093
    depends_on:
      - kafka
    restart: always

  ml-pipeline:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: cloudguard-ml-pipeline
    command: python -u ml/kafka_anomaly_pipeline.py
    environment:
      - KAFKA_SERVER=kafka:9093
    depends_on:
      - kafka
    restart: always

  telemetry-producer:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: cloudguard-telemetry-producer
    command: python -u simulator/telemetry_producer.py
    environment:
      - KAFKA_SERVER=kafka:9093
    depends_on:
      - kafka
      - demo-app
    restart: always
